<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Таймеры</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #888;
    --red: #ff4444;
    --green: #44ff88;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 54px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header h1 span { color: var(--accent); }
  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-icon:active { background: var(--surface); transform: scale(0.94); }

  /* PALETTE TABS */
  .palette-tabs {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  .palette-tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 700;
  }
  .tab:active { transform: scale(0.95); }
  .tab-del {
    font-size: 16px;
    opacity: 0.5;
    cursor: pointer;
    padding: 0 2px;
  }
  .tab-del:active { opacity: 1; }

  /* PALETTE CONTENT */
  .palette-content { padding: 16px 20px 100px; }

  .palette-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .palette-name-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    padding: 10px 14px;
    outline: none;
  }
  .palette-name-input:focus { border-color: var(--accent); }

  /* TIMERS */
  .timer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .timer-card.running { border-color: var(--accent); }
  .timer-card.done { border-color: var(--green); }

  .timer-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .timer-name-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    padding: 8px 12px;
    outline: none;
  }
  .timer-name-input:focus { border-color: var(--accent); }
  .btn-del-timer {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--red);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-del-timer:active { background: #ff444422; }

  /* TIME DISPLAY */
  .timer-display {
    text-align: center;
    margin-bottom: 14px;
  }
  .time-big {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .time-big.running { color: var(--accent); }
  .time-big.done { color: var(--green); }

  /* TIME SETTER */
  .time-setter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 14px;
  }
  .time-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .time-unit label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .time-spin {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .spin-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px;
    height: 28px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .spin-btn:active { background: var(--border); }
  .time-val-input {
    width: 58px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    padding: 6px 4px;
    outline: none;
    margin: 3px 0;
    font-variant-numeric: tabular-nums;
  }
  .time-val-input:focus { border-color: var(--accent); }
  .time-sep {
    font-size: 28px;
    font-weight: 700;
    color: var(--muted);
    padding-bottom: 2px;
    align-self: center;
  }

  /* CONTROLS */
  .timer-controls {
    display: flex;
    gap: 8px;
  }
  .btn-start {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-start.pause { background: var(--accent2); color: #fff; }
  .btn-start:active { transform: scale(0.97); }
  .btn-reset {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .btn-reset:active { background: var(--border); }

  /* ADD TIMER */
  .btn-add-timer {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 14px;
    transition: all 0.15s;
  }
  .btn-add-timer:active { border-color: var(--accent); color: var(--accent); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1000;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* BEEP indicator */
  .btn-stop-sound {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--green);
    background: transparent;
    color: var(--green);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    display: none;
  }
  .btn-stop-sound:active { background: #44ff8822; }
  .beep-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-left: 6px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="header">
  <h1>Трени<span>рую</span>сь</h1>
  <div style="display:flex;gap:8px">
    <button class="btn-icon" id="muteBtn" onclick="toggleMute()" title="Звук">🔊</button>
    <button class="btn-icon" onclick="addPalette()" title="Новая паллета">+</button>
  </div>
</div>

<div class="palette-tabs" id="paletteTabs"></div>

<div class="palette-content" id="paletteContent"></div>

<div class="toast" id="toast"></div>

<script>
let data = { palettes: [], activeId: null };
let intervals = {};
let muted = false;

function toggleMute() {
  muted = !muted;
  if (muted && audioCtx) audioCtx.suspend();
  else if (!muted && audioCtx) audioCtx.resume();
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  showToast(muted ? 'Звук выключен' : 'Звук включён');
}

function save() {
  localStorage.setItem('timer_app_v2', JSON.stringify(data));
}

function load() {
  const raw = localStorage.getItem('timer_app_v2');
  if (raw) {
    try { data = JSON.parse(raw); } catch(e) {}
  }
  if (!data.palettes || data.palettes.length === 0) {
    addPalette('Утренняя', true);
    return;
  }
  if (!data.activeId && data.palettes.length > 0) {
    data.activeId = data.palettes[0].id;
  }
  render();
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function addPalette(name, silent) {
  const id = uid();
  const palette = {
    id,
    name: name || 'Паллета ' + (data.palettes.length + 1),
    timers: [makeTimer()]
  };
  data.palettes.push(palette);
  data.activeId = id;
  save();
  render();
  if (!silent) showToast('Паллета создана!');
}

function makeTimer() {
  return { id: uid(), name: '', hours: 0, minutes: 1, seconds: 30, remaining: null, running: false, done: false };
}

function deletePalette(id) {
  if (data.palettes.length === 1) { showToast('Нельзя удалить последнюю'); return; }
  stopAllInPalette(id);
  data.palettes = data.palettes.filter(p => p.id !== id);
  if (data.activeId === id) data.activeId = data.palettes[0].id;
  save(); render();
}

function stopAllInPalette(pid) {
  const p = data.palettes.find(x => x.id === pid);
  if (!p) return;
  p.timers.forEach(t => {
    if (intervals[t.id]) { clearInterval(intervals[t.id]); delete intervals[t.id]; }
    t.running = false;
  });
}

function setActive(id) {
  data.activeId = id;
  save(); render();
}

function activePalette() {
  return data.palettes.find(p => p.id === data.activeId);
}

function addTimer() {
  const p = activePalette();
  if (!p) return;
  p.timers.push(makeTimer());
  save(); render();
}

function deleteTimer(tid) {
  const p = activePalette();
  if (!p || p.timers.length === 1) { showToast('Минимум 1 таймер'); return; }
  if (intervals[tid]) { clearInterval(intervals[tid]); delete intervals[tid]; }
  p.timers = p.timers.filter(t => t.id !== tid);
  save(); render();
}

function totalSeconds(t) {
  return (t.hours || 0) * 3600 + (t.minutes || 0) * 60 + (t.seconds || 0);
}

function formatTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function startTimer(tid) {
  const p = activePalette();
  const t = p.timers.find(x => x.id === tid);
  if (!t) return;

  if (t.running) {
    clearInterval(intervals[tid]);
    delete intervals[tid];
    t.running = false;
    save(); renderTimerCard(tid); return;
  }

  if (t.done || t.remaining === null) {
    t.remaining = totalSeconds(t);
    t.done = false;
  }
  if (t.remaining <= 0) { t.remaining = totalSeconds(t); t.done = false; }

  t.running = true;
  save(); renderTimerCard(tid);

  intervals[tid] = setInterval(() => {
    const pp = data.palettes.find(pl => pl.timers.some(x => x.id === tid));
    const tt = pp && pp.timers.find(x => x.id === tid);
    if (!tt) { clearInterval(intervals[tid]); return; }
    tt.remaining--;
    if (tt.remaining <= 0) {
      tt.remaining = 0;
      tt.running = false;
      tt.done = true;
      clearInterval(intervals[tid]);
      delete intervals[tid];
      beep().then(() => {
        const ssBtn = document.getElementById('ss_' + tid);
        if (ssBtn) ssBtn.style.display = 'block';
      });
      showToast('⏱ ' + (tt.name || 'Таймер') + ' — готово!');
    }
    save();
    renderTimerCard(tid);
  }, 1000);
}

function resetTimer(tid) {
  const p = activePalette();
  const t = p.timers.find(x => x.id === tid);
  if (!t) return;
  if (intervals[tid]) { clearInterval(intervals[tid]); delete intervals[tid]; }
  t.running = false;
  t.done = false;
  t.remaining = null;
  save(); renderTimerCard(tid);
}

function updateTimerName(tid, val) {
  const p = activePalette(); if (!p) return;
  const t = p.timers.find(x => x.id === tid); if (!t) return;
  t.name = val; save();
}

function updateTimerTime(tid, field, val) {
  const p = activePalette(); if (!p) return;
  const t = p.timers.find(x => x.id === tid); if (!t) return;
  let n = parseInt(val) || 0;
  if (field === 'hours') n = Math.max(0, Math.min(23, n));
  if (field === 'minutes' || field === 'seconds') n = Math.max(0, Math.min(59, n));
  t[field] = n;
  if (!t.running) { t.remaining = null; t.done = false; }
  save(); renderTimerCard(tid);
}

function spinTime(tid, field, delta) {
  const p = activePalette(); if (!p) return;
  const t = p.timers.find(x => x.id === tid); if (!t) return;
  let n = (t[field] || 0) + delta;
  if (field === 'hours') n = Math.max(0, Math.min(23, n));
  if (field === 'minutes' || field === 'seconds') { n = ((n % 60) + 60) % 60; }
  t[field] = n;
  if (!t.running) { t.remaining = null; t.done = false; }
  save(); renderTimerCard(tid);
}

function updatePaletteName(pid, val) {
  const p = data.palettes.find(x => x.id === pid); if (!p) return;
  p.name = val; save(); renderTabs();
}

function renderTabs() {
  const el = document.getElementById('paletteTabs');
  el.innerHTML = data.palettes.map(p => `
    <div class="tab ${p.id === data.activeId ? 'active' : ''}" onclick="setActive('${p.id}')">
      ${esc(p.name || 'Паллета')}
      <span class="tab-del" onclick="event.stopPropagation();deletePalette('${p.id}')">✕</span>
    </div>
  `).join('');
}

function renderTimerCard(tid) {
  const el = document.getElementById('tc_' + tid);
  if (!el) { render(); return; }
  const p = activePalette(); if (!p) return;
  const t = p.timers.find(x => x.id === tid); if (!t) return;
  const rem = t.running || t.done ? t.remaining : null;
  const displaySec = rem !== null ? rem : totalSeconds(t);
  const cls = t.running ? 'running' : (t.done ? 'done' : '');

  el.className = 'timer-card' + (cls ? ' ' + cls : '');
  el.querySelector('.time-big').textContent = formatTime(displaySec);
  el.querySelector('.time-big').className = 'time-big ' + cls;

  const startBtn = el.querySelector('.btn-start');
  startBtn.textContent = t.running ? '⏸ Стоп' : (t.done ? '🔄 Снова' : '▶ Старт');
  startBtn.className = 'btn-start' + (t.running ? ' pause' : '');

  const inputs = el.querySelectorAll('.time-val-input');
  if (!t.running) {
    inputs[0].value = pad(t.hours || 0);
    inputs[1].value = pad(t.minutes || 0);
    inputs[2].value = pad(t.seconds || 0);
  }
  inputs.forEach(inp => inp.disabled = t.running);
  el.querySelectorAll('.spin-btn').forEach(b => b.disabled = t.running);
}

function render() {
  renderTabs();
  const p = activePalette();
  const el = document.getElementById('paletteContent');
  if (!p) { el.innerHTML = '<div class="empty"><div class="emoji">💪</div>Нажми + чтобы создать паллету</div>'; return; }

  el.innerHTML = `
    <div class="palette-name-row">
      <input class="palette-name-input" value="${esc(p.name)}" placeholder="Название паллеты"
        oninput="updatePaletteName('${p.id}', this.value)" />
    </div>
    ${p.timers.map(t => timerCardHTML(t)).join('')}
    <button class="btn-add-timer" onclick="addTimer()">+ Добавить таймер</button>
  `;
}

function timerCardHTML(t) {
  const rem = t.running || t.done ? t.remaining : null;
  const displaySec = rem !== null ? rem : totalSeconds(t);
  const cls = t.running ? 'running' : (t.done ? 'done' : '');
  return `
  <div class="timer-card ${cls}" id="tc_${t.id}">
    <div class="timer-top">
      <input class="timer-name-input" value="${esc(t.name)}" placeholder="Название таймера"
        oninput="updateTimerName('${t.id}', this.value)" />
      <button class="btn-del-timer" onclick="deleteTimer('${t.id}')">✕</button>
    </div>
    <div class="timer-display">
      <div class="time-big ${cls}">${formatTime(displaySec)}</div>
    </div>
    <div class="time-setter">
      ${timeUnitHTML(t, 'hours', 'ч')}
      <span class="time-sep">:</span>
      ${timeUnitHTML(t, 'minutes', 'мин')}
      <span class="time-sep">:</span>
      ${timeUnitHTML(t, 'seconds', 'сек')}
    </div>
    <button class="btn-stop-sound" id="ss_${t.id}" onclick="stopSound()">⏹ Стоп музыки</button>
    <div class="timer-controls">
      <button class="btn-start${t.running ? ' pause' : ''}" onclick="startTimer('${t.id}')">
        ${t.running ? '⏸ Стоп' : (t.done ? '🔄 Снова' : '▶ Старт')}
      </button>
      <button class="btn-reset" onclick="resetTimer('${t.id}')">↺</button>
    </div>
  </div>`;
}

function timeUnitHTML(t, field, label) {
  const val = pad(t[field] || 0);
  const dis = t.running ? 'disabled' : '';
  return `
  <div class="time-unit">
    <label>${label}</label>
    <div class="time-spin">
      <button class="spin-btn" onclick="spinTime('${t.id}','${field}',1)" ${dis}>▲</button>
      <input class="time-val-input" type="number" value="${val}" min="0"
        ${dis}
        onchange="updateTimerTime('${t.id}','${field}',this.value)"
        onfocus="this.select()" />
      <button class="spin-btn" onclick="spinTime('${t.id}','${field}',-1)" ${dis}>▼</button>
    </div>
  </div>`;
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let audioCtx = null;

async function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  return audioCtx;
}

let currentMelodyNodes = [];

function stopSound() {
  currentMelodyNodes.forEach(osc => { try { osc.stop(); } catch(e) {} });
  currentMelodyNodes = [];
  // hide all stop-sound buttons
  document.querySelectorAll('.btn-stop-sound').forEach(b => b.style.display = 'none');
}

async function beep() {
  if (muted) return;
  stopSound();
  try {
    const ctx = await getCtx();

    // Rocky-style victory melody
    const melody = [
      [523, 0.12, 0.04],
      [523, 0.12, 0.04],
      [523, 0.12, 0.04],
      [415, 0.09, 0.03],
      [622, 0.18, 0.06],
      [523, 0.12, 0.04],
      [415, 0.09, 0.03],
      [622, 0.22, 0.10],
      [784, 0.12, 0.04],
      [784, 0.12, 0.04],
      [784, 0.12, 0.04],
      [831, 0.09, 0.03],
      [622, 0.18, 0.06],
      [466, 0.12, 0.04],
      [415, 0.09, 0.03],
      [622, 0.40, 0.00],
    ];

    let t = ctx.currentTime + 0.05;
    melody.forEach(([freq, dur, gap]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const dist = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const x = (i * 2) / 256 - 1;
        curve[i] = (Math.PI + 80) * x / (Math.PI + 80 * Math.abs(x));
      }
      dist.curve = curve;
      osc.connect(gain);
      gain.connect(dist);
      dist.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.linearRampToValueAtTime(freq * 1.01, t + dur * 0.5);
      osc.frequency.linearRampToValueAtTime(freq, t + dur);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.6, t + 0.01);
      gain.gain.setValueAtTime(0.6, t + dur - 0.03);
      gain.gain.linearRampToValueAtTime(0, t + dur);
      osc.start(t);
      osc.stop(t + dur);
      currentMelodyNodes.push(osc);
      t += dur + gap;
    });
  } catch(e) { console.log('audio error', e); }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { render(); }
});

load();
</script>
